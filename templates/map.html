{% extends "base.html" %}
{% block title %}足迹地图{% endblock %}
{% block body_class %}map-page{% endblock %}
{% block content %}
<section class="page-head">
    <h1>中国足迹地图</h1>
    <p>用地图记录你去过的每一个地方</p>
</section>

<div class="map-stats-bar">
    <div class="map-stat-item">
        <div class="map-stat-icon">🏙️</div>
        <div class="map-stat-content">
            <span class="map-stat-num" id="statCities">0</span>
            <span class="map-stat-label">座城市</span>
        </div>
    </div>
    <div class="map-stat-item">
        <div class="map-stat-icon">🏛️</div>
        <div class="map-stat-content">
            <span class="map-stat-num" id="statProvinces">0</span>
            <span class="map-stat-label">个省份</span>
        </div>
    </div>
    <div class="map-stat-item">
        <div class="map-stat-icon">🎫</div>
        <div class="map-stat-content">
            <span class="map-stat-num" id="statTotal">0</span>
            <span class="map-stat-label">张票据</span>
        </div>
    </div>
</div>

<div class="map-container">
    <div class="map-view" id="mapView">
        <div class="map-loading" id="mapLoading">
            <div class="loading-spinner"></div>
            <span>加载地图中...</span>
        </div>
        <div id="echartsMap" style="width:100%;height:100%;"></div>
    </div>

    <aside class="map-sidebar" id="mapSidebar">
        <div class="map-sidebar-header">
            <h3>📍 省份足迹</h3>
            <span class="province-count-badge" id="provinceCountBadge">0 个省份</span>
        </div>
        <div class="province-list" id="provinceList">
            <div class="loading" id="provinceLoading">加载中...</div>
        </div>
    </aside>
</div>
<p id="mapLocationNotice" class="collection-notice" role="status" hidden></p>
<p class="collection-hint">地图按省份与城市汇总。<a href="/list">前往票夹筛选并校对地点</a></p>

<div class="map-legend">
    <div class="legend-item">
        <span class="legend-swatch visited"></span>
        <span>已访问省份</span>
    </div>
    <div class="legend-item">
        <span class="legend-swatch unvisited"></span>
        <span>未访问</span>
    </div>
    <div class="legend-item">
        <span class="legend-dot city"></span>
        <span>城市</span>
    </div>
</div>

<div id="toast" class="toast"></div>
{% endblock %}
{% block scripts %}
<script src="/static/js/echarts.min.js"></script>
<script src="/static/js/map.js"></script>
{% endblock %}
