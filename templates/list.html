{% extends "base.html" %}
{% block title %}我的票夹{% endblock %}
{% block body_class %}wallet-page{% endblock %}
{% block content %}
<section class="wallet-page-wrap">
    <!-- 页面头部 -->
    <header class="wallet-head">
        <div class="wallet-head-text">
            <h1 class="wallet-title">我的票夹</h1>
            <p class="wallet-subtitle">按分类筛选或搜索关键词 · 珍藏每一次出发</p>
        </div>
        <div class="wallet-head-meta" id="walletHeadMeta">
            <span class="wallet-count-dot"></span>
            <span>共 <strong id="walletCount">0</strong> 张票据</span>
        </div>
    </header>

    <!-- 工具栏：分类标签 + 搜索 -->
    <div class="wallet-toolbar">
        <div class="wallet-tabs" id="filterBtns">
            <button type="button" class="wallet-tab active" data-type="全部">
                <span>全部</span>
            </button>
            <button type="button" class="wallet-tab" data-type="车票">
                <span class="wallet-tab-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                </span>
                <span>车票</span>
            </button>
            <button type="button" class="wallet-tab" data-type="演出票">
                <span class="wallet-tab-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.382-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
                </span>
                <span>演出票</span>
            </button>
            <button type="button" class="wallet-tab" data-type="景区票">
                <span class="wallet-tab-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21v-4m18 4v-4M3 7l9-4 9 4M4 10h16v11H4V10z"/></svg>
                </span>
                <span>景区票</span>
            </button>
            <button type="button" class="wallet-tab" data-type="证书">
                <span class="wallet-tab-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                </span>
                <span>证书</span>
            </button>
            <button type="button" class="wallet-tab" data-type="其他">
                <span class="wallet-tab-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                </span>
                <span>其他</span>
            </button>
        </div>
        <div class="wallet-search">
            <svg class="wallet-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
            <input type="text" id="searchInput" class="wallet-search-input" placeholder="搜索类型、平台、地点、备注…">
            <button type="button" id="searchClearBtn" class="wallet-search-clear" aria-label="清除搜索">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
        </div>
    </div>

    <form id="advancedFilters" class="collection-filters">
        <label>开始日期<input type="date" name="date_from"></label>
        <label>结束日期<input type="date" name="date_to"></label>
        <label>省份<input name="province" id="filterProvince" placeholder="全部省份"></label>
        <label>城市<input name="city" id="filterCity" placeholder="全部城市"></label>
        <label>来源平台<input name="platform" placeholder="如：12306"></label>
        <button class="btn btn-primary" type="submit">筛选</button>
        <button class="btn btn-ghost" type="reset">重置</button>
        <a class="btn btn-ghost" href="/collection">备份与回收站</a>
    </form>
    <p id="listStatus" role="status" aria-live="polite"></p>
    <!-- 卡片网格 -->
    <div class="wallet-grid" id="cardGrid">
        <div class="wallet-loading" id="listLoading">
            <span class="wallet-spinner"></span>
            <span>正在加载票夹…</span>
        </div>
        <div class="wallet-empty" id="emptyState" hidden>
            <div class="wallet-empty-art" aria-hidden="true">
                <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="8" y="14" width="48" height="36" rx="6"/>
                    <path d="M8 24h48"/>
                    <path d="M20 38h12"/>
                    <path d="M20 44h8"/>
                    <circle cx="46" cy="44" r="4"/>
                </svg>
            </div>
            <h3 class="wallet-empty-title">票夹空空如也</h3>
            <p class="wallet-empty-desc" id="emptyDesc">还没有收藏任何票据，<a href="/upload">去上传第一张</a></p>
        </div>
    </div>
    <nav class="collection-actions" aria-label="票夹分页"><button id="prevPage" class="btn btn-ghost">上一页</button><span id="pageInfo"></span><button id="nextPage" class="btn btn-ghost">下一页</button></nav>
</section>

<div id="toast" class="toast"></div>
{% endblock %}
{% block scripts %}
<script src="/static/js/locations.js"></script>
<script>bindLocationInputs('filterProvince', 'filterCity');</script>
<script src="/static/js/list.js"></script>
{% endblock %}
